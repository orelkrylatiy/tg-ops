name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: pip install ruff telethon

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check admin.py admin_agent.py admin_runtime.py humanize_reply.py ops_telemetry.py tgcommon.py tests/test_ops_telemetry.py tests/test_admin_control.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Admin CLI smoke test
        run: python admin.py --help

      - name: Admin UI JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("admin/index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", html, re.DOTALL)
          if not match:
              raise SystemExit("Admin UI script block not found")
          Path("/tmp/tg-ops-admin.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/tg-ops-admin.js

      - name: Syntax check all scripts
        run: |
          set -e
          for f in $(git ls-files '*.py'); do
            python -m py_compile "$f"
          done
