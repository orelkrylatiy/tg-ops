name: Temporary Ruff formatter
on:
  push:
    branches: [fix/ci-lint-20261117]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.17.3
      - name: Format remaining CI files
        run: |
          ruff format cron-run.py folders.py humanize_local.py humanize_reply.py leads.py tg.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cron-run.py folders.py humanize_local.py humanize_reply.py leads.py tg.py
          if ! git diff --cached --quiet; then
            git commit -m "style: format remaining Ruff-checked scripts"
            git push
          fi
