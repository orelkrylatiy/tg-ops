name: Temporary Ruff lint fixer
on:
  push:
    branches: [fix/ci-lint-20261117]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.17.3
      - name: Fix lint and format affected files
        run: |
          ruff check --fix --unsafe-fixes humanize.py humanizer_stats.py
          ruff format humanize.py humanizer_stats.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add humanize.py humanizer_stats.py
          if ! git diff --cached --quiet; then
            git commit -m "style: fix Ruff lint in humanizer scripts"
            git push
          fi
